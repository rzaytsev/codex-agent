<!doctype html><html lang="@@LANG@@"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:12px;color:var(--tg-theme-text-color,#182b37);background:var(--tg-theme-bg-color,#fff);font:14px system-ui,sans-serif;overflow-wrap:anywhere}h2{font-size:18px;line-height:1.25;margin:4px 0 6px}p{margin:6px 0;line-height:1.35}.muted,small{color:var(--tg-theme-hint-color,#61717c)}small{font-size:11px}.frame{display:none}svg{width:100%;height:134px;display:block;color:inherit}.grid{stroke:currentColor;opacity:.12}.lead{fill:#1681ad;stroke:#1681ad}.harmony{fill:#d27426;stroke:#d27426}.soft{opacity:.3}.active{opacity:1;stroke-width:2}.mark{fill:var(--tg-theme-button-color,#246ba4)}svg text{fill:currentColor;stroke:none;font:11px system-ui,sans-serif}.chart-note{font-weight:600}nav{display:flex;gap:6px;align-items:center;margin:8px 0}button{font:inherit;border:1px solid var(--tg-theme-hint-color,#a9b3bb);border-radius:8px;padding:8px 10px;background:transparent;color:inherit;min-height:36px}button:disabled{opacity:.45}#counter{flex:1;min-width:0;text-align:center;font-size:12px}.agent{width:100%;margin:4px 0;background:var(--tg-theme-button-color,#246ba4);color:var(--tg-theme-button-text-color,#fff);border:0}#status,#reply{font-size:12px}#reply:empty,#status:empty{display:none}#explanation{min-height:38px;font-size:13px}#context{font-size:12px}.voices{display:flex;gap:12px;font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}#toggle{font-size:12px;padding:8px}#attachments{font-size:11px;margin-top:8px}
.frame:first-child{display:block}.dot.lead{background:#1681ad}.dot.harmony{background:#d27426}
</style></head><body><main><small>@@EVIDENCE@@</small><h2>@@TITLE@@</h2><p id="context" class="muted">@@CONTEXT@@</p>@@LEGEND@@<div id="frames">@@FRAMES@@</div><nav><button id="prev" type="button">@@PREV@@</button><span id="counter"></span><button id="next" type="button">@@NEXT@@</button>@@TOGGLE@@</nav><p id="explanation" role="status"></p><div id="requests">@@ACTIONS@@</div><p id="status" role="status"></p><p id="reply"></p><p id="attachments" class="muted">@@ATTACHMENTS@@</p></main><script>
try{(function(){var C=@@CONFIG@@,step=0,show=true,revision=-1,remoteStep,remoteShow,pending=false,remoteBusy=false,notice='',B=null;try{B=window.TelegramWidget||null}catch(ignore){}
function el(id){return document.getElementById(id)}
function draw(){for(var i=0;i<C.frames.length;i++)el('f'+i).style.display=i===step?'block':'none';el('counter').textContent=(step+1)+' / '+C.frames.length+' · '+C.frames[step].label;el('explanation').textContent=C.frames[step].text;el('prev').disabled=step===0;el('next').disabled=step===C.frames.length-1;for(var j=0;j<C.harmony.length;j++)el(C.harmony[j]).style.display=show?'':'none';if(el('toggle'))el('toggle').textContent=show?C.ui.hide:C.ui.show;for(var k=0;k<C.actions.length;k++)el('a'+k).disabled=pending||remoteBusy||!B||typeof B.request!=='function';el('status').textContent=notice;}
function live(){if(!B)return;try{var e=JSON.parse(B.chatData||'{}');if(!Number.isSafeInteger(e.revision)||e.revision<=revision)return;revision=e.revision;var d=e.data||{};if(Number.isInteger(d.step)&&d.step>=0&&d.step<C.frames.length&&d.step!==remoteStep){step=d.step;remoteStep=d.step}if(typeof d.show_harmony==='boolean'&&d.show_harmony!==remoteShow){show=d.show_harmony;remoteShow=show}remoteBusy=['queued','working','cancel_requested'].indexOf(e.status)>=0;notice=C.ui[e.status]||'';el('reply').textContent=typeof e.reply==='string'?e.reply.slice(0,200):'';draw()}catch(ignore){}}
el('prev').addEventListener('click',function(){if(step>0){step--;draw()}});el('next').addEventListener('click',function(){if(step<C.frames.length-1){step++;draw()}});if(el('toggle'))el('toggle').addEventListener('click',function(){show=!show;draw()});
for(var a=0;a<C.actions.length;a++)(function(i){el('a'+i).addEventListener('click',function(){if(pending||remoteBusy||!B||typeof B.request!=='function')return;pending=true;var before=revision;notice=C.ui.sending;draw();try{var answer=B.request(C.actions[i]);Promise.resolve(answer).then(function(value){pending=false;try{var r=JSON.parse(value.result);live();if(r.accepted===true){if(revision<=before){remoteBusy=true;notice=C.ui.queued}}else{notice=C.ui[r.error]||C.ui.failed}}catch(ignore){notice=C.ui.failed}draw()},function(){pending=false;notice=C.ui.failed;draw()})}catch(ignore){pending=false;notice=C.ui.failed;draw()}})})(a);
draw();live();try{if(B&&typeof B.onEvent==='function')B.onEvent('chatDataChanged',live)}catch(ignore){}try{if(B&&typeof B.ready==='function')B.ready()}catch(ignore){}
})()}catch(ignore){}
</script></body></html>
